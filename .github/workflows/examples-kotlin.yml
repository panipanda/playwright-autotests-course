name: Examples (Kotlin)
# Runs the Kotlin example project against the public demo sites. Started by hand,
# because it needs the internet and one of the demo sites limits the request rate.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: examples/kotlin
      - run: chmod +x gradlew
      - run: ./gradlew playwright --args="install --with-deps chromium"
      - run: ./gradlew test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: |
            examples/kotlin/build/reports/tests/test
            examples/kotlin/build/traces
          if-no-files-found: ignore
