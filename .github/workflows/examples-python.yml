name: Examples (Python)
# Runs the Python example project against the public demo sites. Started by hand,
# because it needs the internet and one of the demo sites limits the request rate.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - run: pip install -r requirements.txt pytest-xdist
      - run: playwright install --with-deps chromium
      - run: pytest -n 2 --base-url https://demo.playwright.dev --tracing retain-on-failure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: examples/python/test-results/
          if-no-files-found: ignore
